<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wayfarer Travel Co. — Coming Soon</title>
<meta name="description" content="Wayfarer Travel Co. is launching soon. Sign up to be the first to know when we take off." />
<style>
  :root {
    --ink: #0f1e2e;
    --paper: #faf6ee;
    --accent: #e8a33d;
    --accent-soft: #f2c879;
    --teal: #1c5d5e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: var(--ink);
    color: var(--paper);
    overflow-x: hidden;
  }

  .sky {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(232, 163, 61, 0.18), transparent 55%),
      radial-gradient(ellipse at 80% 85%, rgba(28, 93, 94, 0.35), transparent 60%),
      linear-gradient(180deg, #0a1622 0%, #0f1e2e 45%, #14293a 100%);
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 50% 30%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 85% 15%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 90% 80%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 40% 90%, rgba(255,255,255,0.3), transparent);
    background-size: 100% 100%;
    opacity: 0.8;
  }

  .plane {
    position: absolute;
    top: 12%;
    left: -10%;
    width: 46px;
    opacity: 0.85;
    animation: fly 34s linear infinite;
  }

  @keyframes fly {
    0%   { transform: translate(-10vw, 0) rotate(8deg); }
    50%  { transform: translate(60vw, -6vh) rotate(8deg); }
    100% { transform: translate(120vw, -2vh) rotate(8deg); }
  }

  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
    text-align: center;
  }

  .badge {
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 0.7rem;
    color: var(--accent-soft);
    border: 1px solid rgba(242, 200, 121, 0.35);
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    margin-bottom: 2.2rem;
    animation: fadeUp 0.9s ease both;
  }

  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(2.4rem, 7vw, 5rem);
    line-height: 1.05;
    margin: 0 0 1rem;
    font-weight: 400;
    animation: fadeUp 0.9s ease 0.1s both;
  }

  h1 span {
    color: var(--accent);
    font-style: italic;
  }

  p.lede {
    max-width: 560px;
    font-size: clamp(1rem, 2vw, 1.15rem);
    line-height: 1.65;
    color: rgba(250, 246, 238, 0.78);
    margin: 0 0 3rem;
    animation: fadeUp 0.9s ease 0.2s both;
  }

  .countdown {
    display: flex;
    gap: clamp(0.8rem, 3vw, 2rem);
    margin-bottom: 3rem;
    animation: fadeUp 0.9s ease 0.3s both;
  }

  .countdown .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 64px;
  }

  .countdown .num {
    font-family: Georgia, serif;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    color: var(--accent-soft);
    font-variant-numeric: tabular-nums;
  }

  .countdown .label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(250, 246, 238, 0.55);
    margin-top: 0.3rem;
  }

  form.notify {
    display: flex;
    width: 100%;
    max-width: 420px;
    gap: 0.6rem;
    animation: fadeUp 0.9s ease 0.4s both;
  }

  form.notify input[type="email"] {
    flex: 1;
    padding: 0.9rem 1.1rem;
    border-radius: 8px;
    border: 1px solid rgba(250, 246, 238, 0.25);
    background: rgba(250, 246, 238, 0.06);
    color: var(--paper);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  form.notify input[type="email"]::placeholder {
    color: rgba(250, 246, 238, 0.45);
  }

  form.notify input[type="email"]:focus {
    border-color: var(--accent);
    background: rgba(250, 246, 238, 0.1);
  }

  form.notify button {
    padding: 0.9rem 1.5rem;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #1a1207;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
    white-space: nowrap;
  }

  form.notify button:hover {
    background: var(--accent-soft);
    transform: translateY(-1px);
  }

  .status {
    margin-top: 1rem;
    font-size: 0.9rem;
    color: var(--accent-soft);
    min-height: 1.2em;
  }

  .socials {
    display: flex;
    gap: 1.4rem;
    margin-top: 3.5rem;
    animation: fadeUp 0.9s ease 0.5s both;
  }

  .socials a {
    color: rgba(250, 246, 238, 0.55);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    border-bottom: 1px solid transparent;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .socials a:hover {
    color: var(--paper);
    border-color: var(--accent);
  }

  footer {
    position: absolute;
    bottom: 1.6rem;
    font-size: 0.75rem;
    color: rgba(250, 246, 238, 0.35);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    form.notify { flex-direction: column; }
  }
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="stars"></div>
  <svg class="plane" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 34 L26 30 L40 6 L46 6 L38 30 L58 30 L62 26 L64 26 L62 34 L64 38 L62 38 L58 34 L38 34 L46 58 L40 58 L26 38 L2 34 Z" fill="#f2c879"/>
  </svg>

  <div class="wrap">
    <span class="badge">Adventure Awaits</span>
    <h1>Wayfarer <span>Travel Co.</span></h1>
    <p class="lede">
      We're mapping out something special — curated trips, unforgettable destinations,
      and journeys made simple. Our new home on the web is almost ready.
    </p>

    <div class="countdown" id="countdown">
      <div class="unit"><span class="num" id="cd-days">00</span><span class="label">Days</span></div>
      <div class="unit"><span class="num" id="cd-hours">00</span><span class="label">Hours</span></div>
      <div class="unit"><span class="num" id="cd-mins">00</span><span class="label">Minutes</span></div>
      <div class="unit"><span class="num" id="cd-secs">00</span><span class="label">Seconds</span></div>
    </div>

    <form class="notify" id="notify-form">
      <input type="email" id="notify-email" placeholder="you@example.com" required />
      <button type="submit">Notify Me</button>
    </form>
    <div class="status" id="notify-status"></div>

    <div class="socials">
      <a href="#" aria-label="Instagram">Instagram</a>
      <a href="#" aria-label="Twitter">Twitter</a>
      <a href="#" aria-label="Facebook">Facebook</a>
    </div>
  </div>

  <footer>&copy; <span id="year"></span> Wayfarer Travel Co. All rights reserved.</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Countdown target: 45 days from first load, persisted so it doesn't reset on refresh
    var LAUNCH_KEY = 'wayfarer-launch-date';
    var launch = localStorage.getItem(LAUNCH_KEY);
    if (!launch) {
      var d = new Date();
      d.setDate(d.getDate() + 45);
      launch = d.toISOString();
      localStorage.setItem(LAUNCH_KEY, launch);
    }
    var launchDate = new Date(launch).getTime();

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      var now = Date.now();
      var diff = Math.max(0, launchDate - now);

      var days = Math.floor(diff / 86400000);
      var hours = Math.floor((diff % 86400000) / 3600000);
      var mins = Math.floor((diff % 3600000) / 60000);
      var secs = Math.floor((diff % 60000) / 1000);

      document.getElementById('cd-days').textContent = pad(days);
      document.getElementById('cd-hours').textContent = pad(hours);
      document.getElementById('cd-mins').textContent = pad(mins);
      document.getElementById('cd-secs').textContent = pad(secs);
    }
    tick();
    setInterval(tick, 1000);

    document.getElementById('notify-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('notify-email').value.trim();
      var statusEl = document.getElementById('notify-status');
      if (!email) return;

      try {
        var list = JSON.parse(localStorage.getItem('wayfarer-signups') || '[]');
        list.push({ email: email, ts: Date.now() });
        localStorage.setItem('wayfarer-signups', JSON.stringify(list));
      } catch (err) {}

      statusEl.textContent = "Thanks! We'll let you know as soon as we launch.";
      this.reset();
    });
  </script>
</body>
</html>
